<!-- This is file for call (init) chatbot -->
<!DOCTYPE html>
<script>
  // ----------------------------- CONSTANTS ----------------------------- //
  // const guid = "FE10595F-12C4-4C59-8FAA-055BB0FCB1A6"; // JJ guid
  // const guid = "9e2db3cf-238b-4182-980e-725e16699331"; // zustand
  // const chatbotSrc = `http://zustand-chatbot.s3-website.eu-west-2.amazonaws.com`; // zustand
  const guid = "f466faec-ea83-4122-8c23-458ab21e96be"; // qa guid
  const chatbotSrc = "http://loop-chat-bot.s3-website.eu-west-2.amazonaws.com"; // TODO: replace with your chatbotSrc

  const BASE_URL = "https://qa-integrations.loopworks.com/api/chatbot";
  const logStyle =
    "background-color: darkblue; color: white; font-style: italic; border: 5px solid hotpink; font-size: 1em; padding: 5px;";
  const IFRAME_ID = "chat-iframe";
  const LOADER_ID = "_chat-bot-loader";
  const LOADER_STYLE_ID = "loader_style_id";
  const MINI_HEIGH = "135px";
  const chatbotMaxHeight = "777px";

  const eventIds = {
    REFRESH_TOKEN: "refresh_token",
    REFRESH_CHATBOT: "refresh_chatbot",
    IFRAME_HEIGHT: "iframe_height",
    GET_CHATBOT_DATA: "get_chatbot_data",
    IS_MOBILE: "is_mobile",
    CHATBOT_VERSION: "chatbot_version",
  };
  // ---------------------------------------------------------------------- //
  let chatBotToken;
  let chatBotStyle;
  let chatBotProps;
  let chatBotCompanyName;
  let chatBotReferralListDomain;
  let chatBotClientApiToken;
  let chatBotIsMobile = false;
  let resizeTimeout;

  function appendChatBot(
    style,
    token,
    props,
    companyName,
    referralListDomain,
    clientApiToken
  ) {
    chatBotStyle = style;
    chatBotProps = props;
    chatBotToken = token;
    chatBotCompanyName = companyName;
    chatBotReferralListDomain = referralListDomain;
    chatBotClientApiToken = clientApiToken;

    if (!document.getElementById(IFRAME_ID)) {
      const ifrm = document.createElement("iframe");
      ifrm.setAttribute("src", chatbotSrc);
      ifrm.setAttribute("id", IFRAME_ID);
      ifrm.setAttribute("width", "370px");
      ifrm.setAttribute(
        "sandbox",
        "allow-popups allow-popups-to-escape-sandbox allow-scripts allow-same-origin"
      );

      ifrm.sandbox.add(
        "allow-popups",
        "allow-popups-to-escape-sandbox",
        "allow-scripts",
        "allow-same-origin"
      );
      ifrm.style.cssText = `position: fixed;right: 10px; bottom: 10px; z-index: 2; border: none;`;
      // transition: all 0.5s ease-in-out;
      const showChatbot = isChatbotAvailable(props?.pages);

      if (showChatbot) {
        document.body?.appendChild(ifrm);

        const currentHeight = window.innerHeight + "px";
        ifrm.addEventListener("load", () => {
          ifrm.contentWindow.postMessage(
            {
              guid,
              style,
              token,
              props,
              companyName,
              referralListDomain,
              clientApiToken,
              hostname: window.location.hostname,
              pathname: window.location.pathname,
              chatbotMaxHeight: chatbotMaxHeight,
              parentHeight: currentHeight,
            },
            ifrm.src
          );

          // Add resize listener after iframe is loaded
          window.addEventListener("resize", onResize);
        });
      }

      ifrm.onerror = () => refreshToken();
    }
  }

  async function refreshToken(callback) {
    try {
      const refreshRes = await fetch(`${BASE_URL}/token`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ ChatbotGuid: guid.trim() }),
      });

      // if request was canceled
      if (refreshRes.status === null) {
        refreshToken(callback);
      }

      const data = await refreshRes.clone().json();

      console.log("refreshToken RES", data);
      if (data?.errors) {
        console.log(data.errors[0]);
        return Promise.reject(data.errors[0]);
      } else {
        callback && callback(data);
        return Promise.resolve(data);
      }
    } catch (error) {
      console.log("%cERROR", logStyle + "color: #d32f2f;", error);
      return Promise.reject(error);
    }
  }

  async function getChatBotStyle(token) {
    try {
      const response = await fetch(
        `${BASE_URL}/configuration/?chatBotGuid=${guid}`
      );

      // if request was canceled
      if (response.status === null) {
        getChatBotStyle(token);
      }

      const data = await response.clone().json();

      if (data?.statusCode === 413) {
        refreshToken(getChatBotStyle);
      } else {
        appendChatBot(
          data?.style,
          token,
          data?.props,
          data?.props?.companyName,
          data?.props?.referralListDomain,
          data?.props?.clientApiToken
        );
      }
    } catch (error) {
      return Promise.reject(error);
    }
  }

  refreshToken(getChatBotStyle);

  function onMessage(event) {
    // console.log("%cEVENT", logStyle, event);
    if (chatbotSrc.indexOf(event.origin) !== -1 && event.data.event_id) {
      const chatbotIframe = document.getElementById(IFRAME_ID);

      LOG(event.data.event_id, "__event_id__");

      switch (event.data.event_id) {
        case eventIds.REFRESH_TOKEN:
          refreshToken(event?.data?.callback)
            .then((data) => {
              if (data && chatbotIframe) {
                chatbotIframe?.contentWindow?.postMessage(
                  { token: data, chatbotMaxHeight: chatbotMaxHeight },
                  chatbotSrc
                );
              }
            })
            .catch((error) => console.log("error", error));

          break;
        case eventIds.REFRESH_CHATBOT:
          console.log("%cREFRESH CHATBOT", logStyle);
          chatbotIframe?.remove();
          refreshToken(getChatBotStyle);
          break;
        case eventIds.IFRAME_HEIGHT:
          if (chatbotIframe && "isSelectedOption" in event.data) {
            const isMobView = !!event.data.isMobile;
            chatbotIframe.style.height = event.data.isSelectedOption
              ? chatBotIsMobile || isMobView
                ? window.innerHeight + "px"
                : chatbotMaxHeight
              : MINI_HEIGH;
          }
          break;
        case eventIds.GET_CHATBOT_DATA:
          // this case for Safari (iframe.onload didn't work)
          chatbotIframe.contentWindow.postMessage(
            {
              guid,
              style: chatBotStyle,
              token: chatBotToken,
              props: chatBotProps,
              companyName: chatBotCompanyName,
              referralListDomain: chatBotReferralListDomain,
              clientApiToken: chatBotClientApiToken,
              hostname: window.location.hostname,
              pathname: window.location.pathname,
              chatbotMaxHeight: chatbotMaxHeight,
            },
            chatbotSrc
          );
          break;

        case eventIds.IS_MOBILE:
          const isMobile = event.data.payload.isMobile;
          if (isMobile) {
            chatBotIsMobile = true;
            chatbotIframe.style.width = "100%";
            chatbotIframe.style.right = "0px";
            chatbotIframe.style.bottom = "0px";
          } else {
            chatBotIsMobile = false;
          }
          break;
        case eventIds.CHATBOT_VERSION:
          window.__chatbot = {
            CODE_VERSION: event.data.payload.CODE_VERSION,
            type: event.data.payload.ENV_TYPE,
          };
          break;
        default:
          break;
      }
    }
  }

  // Function to handle viewport resize
  function onResize() {
    if (resizeTimeout) {
      clearTimeout(resizeTimeout);
    }
    resizeTimeout = setTimeout(() => {
      const currentHeight = window.innerHeight + "px";
      const chatbotIframe = document.getElementById(IFRAME_ID);

      if (chatbotIframe) {
        chatbotIframe.contentWindow.postMessage(
          { event_id: eventIds.IFRAME_HEIGHT, parentHeight: currentHeight },
          chatbotSrc
        );
      }
    }, 200); // Delay to avoid rapid firing of resize events
  }

  function strToArray(str) {
    if (!str?.trim()) return [];
    return str
      ?.replace(/"/g, "")
      ?.replace("{", "")
      ?.replace("}", "")
      ?.split(", ")
      ?.map((p) => (p[0] === "/" ? p : "/" + p));
  }

  function isChatbotAvailable(pages) {
    if (!pages) return false;

    const pathname = window.location.pathname;
    const availablePages = strToArray(pages);

    if (pathname.length === 1) {
      return availablePages?.some((p) => pathname === p);
    } else {
      return availablePages?.some((p) => p !== "/" && pathname.includes(p));
    }
  }

  function LOG(logObj, description, color = "#3B96F0", background = "#90ee90") {
    if (description) {
      console.log(
        `%c   ${description}   `,
        `color: ${color}; font-size: 12px; background-color: ${background};`,
        logObj
      );
    } else {
      console.log(
        `%c   ___   `,
        `color: ${color}; font-size: 12px; background-color: ${background};`,
        logObj
      );
    }
    console.log(
      "_____________________________________________________________"
    );
  }

  if (window.addEventListener) {
    window.addEventListener("message", onMessage);
  } else {
    window.attachEvent("onmessage", onMessage); // IE8
  }
</script>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chat.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat-Bot</title>
  </head>
  <body>
    <div id="root">
      <div>CHATBOT</div>

      <div>can i speak to someone?</div>
    </div>
  </body>
</html>
